<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FranVision — Feature Sheet Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="fsb-app"><div class="fsb-boot">Loading…</div></div>

  <!-- shared logic (also used by Node tests) -->
  <script src="/shared/crop-math.js"></script>

  <!-- fsb-v2 template system (geometry / themes / modules / engine / registry) -->
  <script src="/shared/v2/geometry.js"></script>
  <script src="/shared/v2/themes.js"></script>
  <script src="/shared/v2/modules.js"></script>
  <script src="/shared/v2/layout-engine.js"></script>
  <script src="/shared/v2/registry.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.js"></script>

  <script src="/js/util.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/photo-source.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/js/template-render-v2.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/photo-picker.js"></script>
  <script src="/js/photo-library.js"></script>
  <script src="/js/info-form.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/export-pdf.js"></script>
  <script src="/js/submit.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
